name: Validate SafeTrack Pages

on:
  workflow_run:
    workflows:
      - Deploy SafeTrack Pages
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployed SafeTrack v14
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate static source files
        run: node .github/scripts/validate-static-v14.mjs

      - name: Install browser and PDF test tools
        run: |
          npm init -y
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium

      - name: Test deployed GitHub Pages site
        env:
          SAFETRACK_DEPLOYED_URL: https://franczkod1.github.io/Safetrack-training-demo/
        run: node .github/scripts/live-test-v14.mjs

      - name: Save validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safetrack-v14-validation-${{ github.run_id }}
          path: |
            LIVE_TEST_RESULT.json
            LIVE_TEST_SCREENSHOT.png
            CONFIRMATION_ONE_PAGE.pdf
            CONFIRMATION_THREE_PAGES.pdf
          if-no-files-found: warn
          retention-days: 30
