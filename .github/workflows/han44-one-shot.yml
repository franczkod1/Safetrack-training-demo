name: HAN44 one-shot source parity
on:
  push:
    branches:
      - fix/han-44-14-participants
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/han-44-14-participants
      - name: Apply exact pagination constant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('print.js')
          s = p.read_text()
          old = 'GROUP_ROWS=15'
          new = 'GROUP_ROWS=14'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one {old}, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source parity and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/han44-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add print.js .github/workflows/han44-one-shot.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(HAN-44): use 14 participants per group page'
          git push origin HEAD:fix/han-44-14-participants
