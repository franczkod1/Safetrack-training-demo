name: Deploy SafeTrack Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: safetrack-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy current SafeTrack v14 build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          files=(
            index.html
            styles.css
            employee-training-groups.css
            seed-base.js
            trainings-a.js
            trainings-b.js
            data-final.js
            status-fixture.js
            app.js
            employee-training-groups.js
          )

          for file in "${files[@]}"; do
            test -s "$file"
            cp "$file" "_site/$file"
          done

          touch _site/.nojekyll
          printf 'SafeTrack v14\nCommit: %s\n' "$GITHUB_SHA" > _site/BUILD.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
