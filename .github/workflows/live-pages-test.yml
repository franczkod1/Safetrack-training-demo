name: SafeTrack direct static validation

on:
  push:
    branches: [main]
    paths-ignore:
      - LIVE_TEST_RESULT.json
      - LIVE_TEST_SCREENSHOT.png
      - STATIC_VALIDATION_RESULT.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safetrack-direct-static-validation
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove previous test artifacts
        run: rm -f LIVE_TEST_RESULT.json LIVE_TEST_SCREENSHOT.png STATIC_VALIDATION_RESULT.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate direct static source files
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node .github/scripts/validate-static.mjs > STATIC_VALIDATION_RESULT.txt 2>&1
          status=$?
          cat STATIC_VALIDATION_RESULT.txt
          exit $status

      - name: Wait for the exact GitHub Pages files
        id: deploy
        if: steps.static.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://franczkod1.github.io/Safetrack-training-demo/'
          files=(
            index.html
            styles.css
            seed-base.js
            trainings-a.js
            trainings-b.js
            data-final.js
            status-fixture.js
            app.js
          )

          for attempt in $(seq 1 36); do
            all_match=1
            rm -rf /tmp/safetrack-pages-check
            mkdir -p /tmp/safetrack-pages-check

            for file in "${files[@]}"; do
              if ! curl -fsSL "${base}${file}?commit=${GITHUB_SHA}&attempt=${attempt}" -o "/tmp/safetrack-pages-check/${file}"; then
                echo "${file}: not available yet"
                all_match=0
                continue
              fi

              if ! cmp -s "${file}" "/tmp/safetrack-pages-check/${file}"; then
                echo "${file}: deployed bytes do not yet match the checked-out file"
                all_match=0
              fi
            done

            if [ "${all_match}" -eq 1 ]; then
              echo 'The exact checked-out static files are live on GitHub Pages.'
              exit 0
            fi

            echo "Waiting for GitHub Pages deployment (${attempt}/36)..."
            sleep 10
          done

          echo 'Timed out waiting for the exact direct static GitHub Pages deployment.'
          exit 1

      - name: Install browser test tools
        if: steps.static.outcome == 'success' && steps.deploy.outcome == 'success'
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test the deployed GitHub Pages site
        id: smoke
        if: steps.static.outcome == 'success' && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: node .github/scripts/live-test.mjs

      - name: Create fallback result for an early failure
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TEST_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('LIVE_TEST_RESULT.json')) {
            const staticLog = fs.existsSync('STATIC_VALIDATION_RESULT.txt')
              ? fs.readFileSync('STATIC_VALIDATION_RESULT.txt', 'utf8')
              : '';
            const result = {
              testedAt: new Date().toISOString(),
              commit: process.env.TEST_COMMIT,
              url: `https://franczkod1.github.io/Safetrack-training-demo/?live-test=${process.env.TEST_COMMIT}`,
              expectedBuild: 'direct-static-v7',
              passed: false,
              checks: {
                staticValidationOutcome: process.env.STATIC_OUTCOME || 'not-run',
                deploymentOutcome: process.env.DEPLOY_OUTCOME || 'not-run',
                browserTestOutcome: process.env.SMOKE_OUTCOME || 'not-run'
              },
              errors: [staticLog.trim() || 'The workflow stopped before the browser test produced a result.']
            };
            fs.writeFileSync('LIVE_TEST_RESULT.json', `${JSON.stringify(result, null, 2)}\n`);
          }
          NODE

      - name: Save public test result and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_TEST_RESULT.json STATIC_VALIDATION_RESULT.txt
          if [ -f LIVE_TEST_SCREENSHOT.png ]; then git add LIVE_TEST_SCREENSHOT.png; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record SafeTrack direct static live test [skip ci]"
          fi
          git pull --rebase
          git push

      - name: Enforce public test result
        if: always()
        run: node -e "const r=require('./LIVE_TEST_RESULT.json'); if(!r.passed){console.error(r); process.exit(1)}"
