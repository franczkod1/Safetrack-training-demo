name: SafeTrack deploy and public validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: safetrack-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package SafeTrack v14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate v14 static source files
        run: |
          set -o pipefail
          node .github/scripts/validate-static-v14.mjs 2>&1 | tee STATIC_VALIDATION_RESULT.txt
      - name: Build exact GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          files=(
            index.html
            styles.css
            employee-training-groups.css
            seed-base.js
            trainings-a.js
            trainings-b.js
            data-final.js
            status-fixture.js
            app.js
            employee-training-groups.js
          )
          for file in "${files[@]}"; do
            test -s "${file}"
            cp "${file}" "_site/${file}"
          done
          touch _site/.nojekyll
      - name: Verify packaged v14 artifact
        run: |
          grep -q 'direct-static-v14' _site/index.html
          grep -q 'SafeTrack v14' _site/index.html
          grep -q 'employee-training-groups.js?v=14' _site/index.html
          ! grep -q 'safetrack-v13' _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Save static validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safetrack-static-validation-v14-${{ github.run_id }}
          path: STATIC_VALIDATION_RESULT.txt
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy SafeTrack v14 to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  public-test:
    name: Test deployed SafeTrack v14 site
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser and PDF test tools
        run: |
          npm init -y
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Test the deployed GitHub Pages v14 site
        id: smoke
        continue-on-error: true
        env:
          SAFETRACK_DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: node .github/scripts/live-test-v14.mjs
      - name: Save public test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safetrack-public-test-v14-${{ github.run_id }}
          path: |
            LIVE_TEST_RESULT.json
            LIVE_TEST_SCREENSHOT.png
            CONFIRMATION_ONE_PAGE.pdf
            CONFIRMATION_THREE_PAGES.pdf
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce public v14 test result
        if: always()
        run: |
          test -s LIVE_TEST_RESULT.json
          node -e "const r=require('./LIVE_TEST_RESULT.json'); if(!r.passed){console.error(r); process.exit(1)}"
