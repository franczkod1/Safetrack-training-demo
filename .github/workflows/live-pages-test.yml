name: SafeTrack live Pages test

on:
  push:
    branches: [main]
    paths-ignore:
      - LIVE_TEST_RESULT.json
      - LIVE_TEST_SCREENSHOT.png
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safetrack-live-pages-test
  cancel-in-progress: true

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test tools
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test the deployed GitHub Pages site
        id: smoke
        continue-on-error: true
        run: node .github/scripts/live-test.mjs
      - name: Save public test result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_TEST_RESULT.json
          if [ -f LIVE_TEST_SCREENSHOT.png ]; then git add LIVE_TEST_SCREENSHOT.png; fi
          git commit -m "Record SafeTrack live Pages test [skip ci]" || exit 0
          git push
      - name: Enforce test result
        if: always()
        run: node -e "const r=require('./LIVE_TEST_RESULT.json'); if(!r.passed){console.error(r); process.exit(1)}"
