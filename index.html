<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="safetrack-loader-build" content="2026-08-06-kpi-hotfix-1">
<title>SafeTrack wird geladen</title>
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#101828}
main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.spinner{width:44px;height:44px;border:4px solid #dbe7ff;border-top-color:#155eef;border-radius:50%;animation:s 1s linear infinite;margin:auto}
@keyframes s{to{transform:rotate(360deg)}}
p{color:#667085}
#error{color:#b42318;max-width:600px}
</style>
</head>
<body>
<main><div><div class="spinner"></div><h1>SafeTrack</h1><p id="status">Anwendung wird geladen…</p><p id="error"></p></div></main>
<script>
(async()=>{
  try{
    const files=['payload/part00.txt','payload/part01.txt','payload/part02.txt','payload/part03.txt','payload/part04.txt','payload/part05.txt','payload/part06.txt'];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(`${f}: ${r.status}`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Dieser Browser unterstützt die benötigte GZIP-Dekomprimierung nicht.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const patchedHtml=html.replace('</body>','<script src="kpi-hotfix.js?v=20260806-1"><\/script></body>');
    document.open();
    document.write(patchedHtml);
    document.close();
  }catch(e){
    document.getElementById('status').textContent='Die Anwendung konnte nicht geladen werden.';
    document.getElementById('error').textContent=e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
