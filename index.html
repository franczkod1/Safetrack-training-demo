<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="safetrack-loader-build" content="catalog-50-safari-fallback-20260806-2">
<title>SafeTrack wird geladen</title>
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#101828}
main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.spinner{width:44px;height:44px;border:4px solid #dbe7ff;border-top-color:#155eef;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}p{color:#667085}#error{color:#b42318;white-space:pre-wrap;max-width:720px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js" integrity="sha384-+sF7OG4t5zS7ckZb5H9lNQ4xMsvQ6sMZ0b8kStzMbV9jK4kQx36YGkK8s+0gGq4U" crossorigin="anonymous"></script>
</head>
<body>
<main><div><div class="spinner"></div><h1>SafeTrack</h1><p id="status">Anwendung wird geladen…</p><p id="error"></p></div></main>
<script>
(async()=>{
  const files=[
    'catalog50-v1/part00.txt','catalog50-v1/part01.txt','catalog50-v1/part02.txt',
    'catalog50-v1/part03.txt','catalog50-v1/part04.txt','catalog50-v1/part05.txt','catalog50-v1/part06.txt'
  ];
  const expected='8c4ee57d1dbd6e2e56190db9b5870e387f07157ca8ac2245051bf3eb2d01fb6c';
  const build='20260806-catalog50-safari-2';
  const hex=buffer=>[...new Uint8Array(buffer)].map(value=>value.toString(16).padStart(2,'0')).join('');
  try{
    const parts=await Promise.all(files.map(async file=>{
      const response=await fetch(`${file}?v=${build}`,{cache:'no-store'});
      if(!response.ok)throw new Error(`${file}: HTTP ${response.status}`);
      return (await response.text()).replace(/\s+/g,'');
    }));
    const encoded=parts.join('');
    if(!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded))throw new Error('Ungültige Base64-Daten im Anwendungspaket.');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let index=0;index<binary.length;index++)bytes[index]=binary.charCodeAt(index);
    if(!window.pako?.ungzip)throw new Error('Der kompatible Dekomprimierer konnte nicht geladen werden. Bitte die Seite erneut öffnen.');
    const html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
    const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));
    if(digest!==expected)throw new Error(`Integritätsprüfung fehlgeschlagen. Erwartet ${expected}, erhalten ${digest}.`);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').textContent='Die Anwendung konnte nicht geladen werden.';
    document.getElementById('error').textContent=error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
